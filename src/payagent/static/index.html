<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Payment Test Agent</title>
<style>
  :root { --bg:#0f1420; --panel:#171e2e; --line:#26304a; --text:#e6e9ef; --muted:#93a0b8; --pass:#2fbf71; --fail:#ef5b5b; --warn:#f0b429; --accent:#3d8bfd; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width: 1040px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h3 { margin: 0 0 10px; font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .panel { background: var(--panel); border-radius: 12px; padding: 18px; margin-bottom: 18px; }
  textarea { width:100%; min-height:70px; padding:12px; border-radius:8px; border:1px solid #2a3550; background:#0d1220; color:var(--text); font:inherit; resize:vertical; }
  .row { display:flex; gap:12px; align-items:center; margin-top:12px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .chips button, .downloads button { background:#24304a; font-weight:400; padding:6px 10px; font-size:13px; }
  .downloads button:hover, .chips button:hover { background:#2e3d5e; }
  .grid { display:grid; grid-template-columns: 1fr 1.6fr; gap:18px; }
  @media (max-width: 820px) { .grid { grid-template-columns: 1fr; } }
  .verdict { font-size:24px; font-weight:700; }
  .PASS { color:var(--pass); } .FAIL { color:var(--fail); } .INCONCLUSIVE { color:var(--warn); } .RUNNING { color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; }
  td.call { font-family: ui-monospace, Consolas, monospace; font-size: 12px; word-break: break-all; }
  tr.new { animation: flash 1.2s ease-out; }
  @keyframes flash { from { background: rgba(61,139,253,.25); } to { background: transparent; } }
  .pill { display:inline-block; padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; }
  .pill.ok { background:rgba(47,191,113,.15); color:var(--pass); } .pill.bad { background:rgba(239,91,91,.15); color:var(--fail); }
  .pill.run { background:rgba(61,139,253,.15); color:var(--accent); }
  .pill.neg { background:rgba(240,180,41,.15); color:var(--warn); }
  ol { margin:0; padding-left: 20px; } li { margin: 3px 0; }
  .log { font-size: 13px; color: var(--muted); max-height: 220px; overflow:auto; }
  .log p { margin: 0 0 8px; border-left: 2px solid var(--line); padding-left: 10px; }
  .finding { border-left:3px solid var(--warn); padding:6px 12px; margin:10px 0; }
  .finding.critical, .finding.major { border-color: var(--fail); }
  .finding.info { border-color: var(--pass); }
  .muted { color: var(--muted); } label { color: var(--muted); }
  .spinner { display:inline-block; width:14px; height:14px; border:2px solid var(--accent); border-right-color:transparent; border-radius:50%; animation: spin .8s linear infinite; vertical-align: -2px; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <h1>AI Payment Test Agent</h1>
  <p class="sub">Describe a payment test in plain English. The agent plans it, runs it against the PayPal sandbox, validates every response and explains any bugs.</p>

  <section class="panel">
    <textarea id="goal" placeholder="e.g. Test a partial refund on a captured order"></textarea>
    <div class="row chips" id="examples"></div>
    <div class="row">
      <button id="run">Run test</button>
      <label><input type="checkbox" id="fake"> Use fake PayPal (offline demo)</label>
      <span id="status" class="muted"></span>
    </div>
  </section>

  <section id="live" hidden>
    <div class="panel">
      <div id="verdict" class="verdict"></div>
      <div id="stats" class="muted"></div>
      <p id="summary"></p>
      <div id="findings"></div>
      <div class="row downloads" id="downloads" hidden>
        <span class="muted">Download report:</span>
        <button type="button" data-kind="md">Markdown</button>
        <button type="button" data-kind="json">JSON</button>
        <button type="button" data-kind="xml">JUnit XML</button>
      </div>
    </div>
    <div class="grid">
      <div>
        <div class="panel"><h3>Test plan</h3><ol id="plan"><li class="muted">Planning…</li></ol></div>
        <div class="panel"><h3>Agent notes</h3><div id="log" class="log"></div></div>
      </div>
      <div class="panel"><h3>API steps (live)</h3>
        <table><thead><tr><th>Step</th><th>Call</th><th>HTTP</th><th>Checks</th></tr></thead><tbody id="steps"></tbody></table>
      </div>
    </div>
    <div class="panel"><h3>Checks</h3>
      <table><thead><tr><th></th><th>Step</th><th>Check</th><th>Expected</th><th>Actual</th></tr></thead><tbody id="checks"></tbody></table>
    </div>
  </section>
</main>
<script>
const $ = (id) => document.getElementById(id);
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text !== undefined) e.textContent = text; if (cls) e.className = cls; return e; };
const fmt = (v) => typeof v === "string" ? v : JSON.stringify(v);
const pill = (text, cls) => el("span", text, "pill " + cls);

fetch("/api/examples").then((r) => r.json()).then((goals) => {
  goals.forEach((g) => { const b = el("button", g); b.type = "button"; b.onclick = () => { $("goal").value = g; }; $("examples").appendChild(b); });
});

function addCheckRow(c) {
  const tr = el("tr"); tr.className = "new";
  const desc = c.retracted ? `${c.description} (retracted by agent: ${c.retracted})` : c.description;
  [c.retracted ? "↩️" : c.passed ? "✅" : "❌", c.step_id || "", desc, fmt(c.expected), fmt(c.actual)].forEach((v) => tr.appendChild(el("td", v)));
  if (c.retracted) tr.style.opacity = ".55";
  $("checks").appendChild(tr);
}

function stepCells(tr, s) {
  tr.replaceChildren();
  const tdId = el("td"); tdId.appendChild(document.createTextNode(s.id + " "));
  if (s.expect === "error") tdId.appendChild(pill("negative", "neg"));
  tr.appendChild(tdId);
  tr.appendChild(el("td", s.method ? `${s.method} ${s.path}` : s.tool, "call"));
  const http = el("td");
  if (s.status === undefined) { http.appendChild(el("span", "", "spinner")); }
  else http.textContent = s.status ?? "ERR";
  tr.appendChild(http);
  const chk = el("td");
  if (s.checks) { const live = s.checks.filter((c) => !c.retracted); const ok = live.filter((c) => c.passed).length; chk.appendChild(pill(`${ok}/${live.length}`, ok === live.length ? "ok" : "bad")); }
  tr.appendChild(chk);
}

function reset() {
  $("live").hidden = false; $("downloads").hidden = true; lastResult = null;
  $("verdict").replaceChildren(el("span", "", "spinner"), document.createTextNode(" Running"));
  $("verdict").className = "verdict RUNNING";
  $("stats").textContent = ""; $("summary").textContent = ""; $("findings").replaceChildren();
  $("plan").replaceChildren(el("li", "Planning…", "muted"));
  $("log").replaceChildren(); $("steps").replaceChildren(); $("checks").replaceChildren();
}

function finish(msg, failed) {
  $("run").disabled = false; $("status").textContent = msg || "";
  if (failed) { $("verdict").textContent = "Not run"; $("verdict").className = "verdict INCONCLUSIVE"; }
}

const handlers = {
  plan: (d) => $("plan").replaceChildren(...d.steps.map((s) => el("li", s))),
  agent_note: (d) => { $("log").appendChild(el("p", d.text)); $("log").scrollTop = 1e9; },
  step_started: (d) => {
    const tr = el("tr"); tr.id = "row-" + d.step_id; tr.className = "new";
    stepCells(tr, { id: d.step_id, tool: d.tool, expect: (d.args || {}).expect }); $("steps").appendChild(tr);
  },
  step_finished: (s) => { const tr = $("row-" + s.id) || $("steps").appendChild(el("tr")); stepCells(tr, s); s.checks.forEach(addCheckRow); },
  check: (c) => addCheckRow(c),
  check_retracted: (c) => $("log").appendChild(el("p", `Retracted my check "${c.description}": ${c.retracted}`)),
  approval_needed: (d) => {
    const p = el("p"); p.appendChild(document.createTextNode("Buyer approval needed: "));
    const a = el("a", "open approval page"); a.href = d.url; a.target = "_blank"; a.rel = "noopener"; p.appendChild(a); $("log").appendChild(p);
  },
  result: (d) => { renderResult(d); finish(); },
  error: (d) => finish("Error: " + d.message, true),
};

// fetch + manual SSE parsing (unlike EventSource, this can read the 429 "demo busy" message).
$("run").onclick = async () => {
  const goal = $("goal").value.trim();
  if (goal.length < 5) { $("status").textContent = "Enter a test goal first."; return; }
  reset(); $("run").disabled = true; $("status").textContent = "";
  const qs = new URLSearchParams({ goal, fake: $("fake").checked });
  let gotResult = false;
  try {
    const res = await fetch("/api/run/stream?" + qs, { headers: { Accept: "text/event-stream" } });
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      const detail = Array.isArray(body.detail) ? "Goal must be 5-500 characters." : (body.detail || res.statusText);
      finish(detail, true); return;
    }
    const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += value;
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const block = buf.slice(0, idx); buf = buf.slice(idx + 2);
        const kind = (block.match(/^event: (.*)$/m) || [])[1];
        const data = (block.match(/^data: (.*)$/m) || [])[1];
        if (kind && data && handlers[kind]) { if (kind === "result") gotResult = true; handlers[kind](JSON.parse(data)); }
      }
    }
    if (!gotResult && $("run").disabled) finish("The connection closed before the run finished.", true);
  } catch (err) { finish("Network error: " + err.message, true); }
};

let lastResult = null;
const slug = () => (lastResult.goal.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 50) || "report");
document.querySelectorAll("#downloads button").forEach((b) => b.onclick = () => {
  if (!lastResult) return;
  const k = b.dataset.kind;
  const { markdown, junit, ...json } = lastResult;
  const content = k === "md" ? markdown : k === "xml" ? junit : JSON.stringify(json, null, 2);
  const type = k === "md" ? "text/markdown" : k === "xml" ? "application/xml" : "application/json";
  const a = el("a"); a.href = URL.createObjectURL(new Blob([content], { type })); a.download = `${slug()}.${k}`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
});

function renderResult(d) {
  lastResult = d; $("downloads").hidden = false;
  $("verdict").textContent = d.verdict; $("verdict").className = "verdict " + d.verdict;
  const active = d.checks.filter((c) => !c.retracted);
  const passed = active.filter((c) => c.passed).length;
  const retracted = d.checks.length - active.length;
  $("stats").textContent = `${passed}/${active.length} checks passed` + (retracted ? ` (${retracted} retracted)` : "") + ` · ${d.steps.length} API calls · ${d.model}` + (d.agent_error ? ` · ${d.agent_error}` : "");
  $("summary").textContent = d.summary;
  $("findings").replaceChildren(...d.findings.map((f) => {
    const box = el("div", undefined, "finding " + f.severity);
    box.appendChild(el("strong", `[${f.severity.toUpperCase()}] ${f.title}`));
    box.appendChild(el("div", f.explanation));
    return box;
  }));
  // final, authoritative checks table
  $("checks").replaceChildren(); d.checks.forEach(addCheckRow);
}
</script>
</body>
</html>
